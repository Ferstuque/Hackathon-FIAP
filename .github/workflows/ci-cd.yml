name: CI Pipeline

on:
  push:
    branches:
      - master
      - feature/*
  pull_request:
    branches:
      - master

# Força o uso do Node.js 24 para evitar os avisos de depreciação
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-upload-service:
    name: Test Upload Service
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Versão estável que suporta Node24 via env

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Garante a instalação do plugin de cobertura e do asyncio
          pip install pytest pytest-asyncio pytest-cov httpx coverage
          if [ -f services/upload-service/requirements.txt ]; then 
            pip install -r services/upload-service/requirements.txt
          fi

      - name: Run Tests with Coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/services/upload-service:${{ github.workspace }}/shared
        run: |
          cd services/upload-service
          # O comando abaixo agora será reconhecido porque instalamos o pytest-cov acima
          pytest --cov=src tests/ --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage to Actions
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-upload
          path: services/upload-service/coverage.xml

  test-ai-processor:
    name: Test AI Processor Worker
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov httpx coverage
          if [ -f services/ai-processor/requirements.txt ]; then
            pip install -r services/ai-processor/requirements.txt
          fi

      - name: Run Tests with Coverage
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services/ai-processor
        run: |
          cd services/ai-processor
          pytest --cov=src tests/ --cov-report=xml

      - name: Upload AI Processor Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-ai
          path: services/ai-processor/coverage.xml